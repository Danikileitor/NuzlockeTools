<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#12141c">
<title>Pokemon TeamSheet</title>
<link rel="stylesheet" href="css/teamsheet.css">
</head>
<body>
<header>
  <div class="brand">
    <a class="btn" href="index.html" title="Inicio" aria-label="Inicio">⌂</a>
    <h1>Pokemon <span>TeamSheet</span></h1>
    <select id="gen" class="gensel" title=""></select>
    <div class="teams" id="teams" role="group"></div>
    <div class="seg" id="side" role="tablist"></div>
  </div>
  <select id="lang" class="lang" title="">
    <option value="es">Castellano</option>
    <option value="en">English</option>
  </select>
  <button class="btn toggle" id="randomlocke" type="button" aria-pressed="false" title="Randomlocke: permite elegir cualquier habilidad para cada Pokémon">Randomlocke</button>
  <button class="btn" id="resetAll">Liberar todo</button>
</header>
<main id="board"></main>
<footer><span id="foot"></span><button class="btn danger" id="wipe" type="button"></button></footer>

<script src="js/shared.js"></script>
<script src="js/teamsheet-data.js"></script>
<script src="js/starter-data.js"></script>
<script src="js/vendor/smogon-calc/calc.min.js"></script>
<script src="js/vendor/smogon-calc/data.min.js"></script>
<script src="js/calc-engine.js"></script>
<script src="js/calc-bridge.js"></script>
<script src="js/teamsheet.js"></script>
</body>
</html>
